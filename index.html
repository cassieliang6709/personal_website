        <article class="story-panel about-panel">
          <p class="eyebrow" data-zh="床边 · ABOUT" data-en="BY THE BED · ABOUT"></p>
          <h1 id="aboutTitle" data-zh="嗨，我是 Cassie。" data-en="Hi, I'm Cassie."></h1>
          <p class="lede" data-zh="00 后，在新疆哈密长大，现在在美国湾区读人工智能硕士，一边上课，一边做自己的 app。" data-en="I grew up in Hami, Xinjiang. I now study AI in the Bay Area while building my own apps."></p>
          <p data-zh="我本科读的是上财国际会计，后来在德勤做审计。审计让我习惯追问“凭什么相信这个数”，也让我第一次做出一个其他团队愿意继续使用的工具。后来我发现，自己真正想做的是造东西，而不只是分析东西。" data-en="I studied international accounting at SUFE, then worked in audit at Deloitte. Audit taught me to ask why a number should be trusted, and led me to build a tool other teams wanted to keep using. I eventually realized I wanted to make things, not only analyze them."></p>

          <div class="fact-list" aria-label="关于 Cassie 的几个事实">
            <span data-zh="哈密长大" data-en="Raised in Hami"></span>
            <span data-zh="NEU MSAI 在读" data-en="NEU MSAI"></span>
            <span data-zh="前德勤审计" data-en="Former Deloitte auditor"></span>
            <span data-zh="独立开发" data-en="Independent builder"></span>
          </div>

          <details class="room-letter">
            <summary data-zh="打开床头的小纸条" data-en="Open the note by the bed"></summary>
            <div>
              <p data-zh="小时候我在 B 站学修手机、折纸，也在贴吧给别人做动态签名。高考理科新疆第 175 名。那时留下来的不是“优秀学生”的标签，而是我总觉得：工具可以被拆开，也可以被重新做一遍。" data-en="As a kid I learned phone repair and origami online, and made animated forum signatures for strangers. I ranked 175th in Xinjiang's science-track gaokao. What stayed was not the label of a good student, but the belief that tools can be opened, understood, and remade."></p>
              <blockquote data-zh="我可以改造工具，而不只是使用工具。" data-en="I can reshape tools, not only use them."></blockquote>
            </div>
          </details>
        </article>
