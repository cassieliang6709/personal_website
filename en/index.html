          <p class="lede" data-zh="我现在在湾区读人工智能硕士，想成为一名可以独立把产品做出来的工程师。" data-en="I am an AI master's student in the Bay Area, working toward becoming an engineer who can take a product from idea to release independently."></p>
          <p data-zh="我是新疆人，本科在上海读国际会计。后来在盒马、KnowYourself、美团和德勤工作，做过产品运营、产品经理、商业分析和审计。" data-en="I am from Xinjiang and studied international accounting in Shanghai. I later worked at Hema, KnowYourself, Meituan, and Deloitte in product operations, product management, business analysis, and audit."></p>
          <p data-zh="离开德勤以后，我去了杭州，注册公司、开网店，也开始认真学 coding。Tabspace 已经上架 Chrome 商店，1Day 正在 private beta，Cassie Capture 的发布包也已经准备好。我现在一边继续做这些产品，一边补计算机和 AI 的基础。" data-en="After Deloitte, I moved to Hangzhou, registered a company, opened an online shop, and began learning to code seriously. Tabspace is live in the Chrome Web Store, 1Day is in private beta, and the release package for Cassie Capture is ready. I keep building these products while strengthening my foundations in computer science and AI."></p>
